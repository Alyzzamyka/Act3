<!DOCTYPE html>
<html>
<head>
    <title>Coffee Menu</title>

    <style>
        body {
            font-family: Arial;
            background-color: beige;
            text-align: center;
        }

        h1 {
            color: brown;
        }

        .menu {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
        }

        p {
            border-bottom: 1px solid gray;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Coffee Shop</h1>
    <p>Welcome to our simple coffee menu!</p>

    <div class="menu">
        <h2>Menu</h2>
        <p>Americano - ₱80</p>
        <p>Cappuccino - ₱100</p>
        <p>Caramel Latte - ₱120</p>
        <p>Iced Coffee - ₱90</p>
        <p>Mocha - ₱110</p>
    </div>

</body>
</html>
